name: CI
on:
  push:
    branches: [master]
  schedule:
  - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  specs:
    # if: false # uncomment this to only deploy
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
        - { name: ruby, ruby: ruby-4.0, repo: ruby/ruby }
        - { name: jruby, ruby: jruby-head, repo: jruby/jruby }
        - { name: truffleruby, ruby: truffleruby-head, repo: oracle/truffleruby }
    runs-on: ubuntu-latest
    env:
      JRUBY_OPTS: "--dev" # Takes 14min instead of 21min otherwise on JRuby
      # No other implementation-specific options are allowed, we should test with no options, that is with defaults, because that is what users see.
    steps:
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}

    - if: matrix.name != 'ruby'
      id: ruby_revision
      run: echo "sha=$(ruby -e 'puts RUBY_REVISION')" >> $GITHUB_OUTPUT
    - if: matrix.name != 'ruby'
      uses: actions/checkout@v4
      with:
        repository: ${{ matrix.repo }}
        ref: ${{ steps.ruby_revision.outputs.sha }}

    - if: matrix.name == 'ruby'
      uses: actions/checkout@v4
      with:
        repository: ${{ matrix.repo }}

    - name: Remove file on CRuby to test the ruby in PATH
      run: rm spec/default.mspec
      if: matrix.name == 'ruby'

    - run: mkdir ${{ matrix.name }}

    - name: Save RUBY_VERSION
      run: ruby -e 'puts RUBY_VERSION' > ${{ matrix.name }}/RUBY_VERSION

    - name: Set MSPEC
      run: echo "MSPEC=spec/mspec/bin/mspec ci --timeout 60 --target $(which ruby) --marker . --format yaml --output stats.yml" >> $GITHUB_ENV

    - name: language specs
      run: $MSPEC spec/ruby/language
      continue-on-error: true
    - run: mv stats.yml ${{ matrix.name }}/language.yml

    - name: core specs
      run: $MSPEC spec/ruby/core
      continue-on-error: true
    - run: mv stats.yml ${{ matrix.name }}/core.yml

    - name: library specs
      run: $MSPEC spec/ruby/library
      continue-on-error: true
    - run: mv stats.yml ${{ matrix.name }}/library.yml

    - name: security specs
      run: $MSPEC spec/ruby/security
      continue-on-error: true
    - run: mv stats.yml ${{ matrix.name }}/security.yml

    - name: command_line specs
      run: $MSPEC spec/ruby/command_line
      continue-on-error: true
    - run: mv stats.yml ${{ matrix.name }}/command_line.yml

    - name: capi specs
      run: $MSPEC spec/ruby/optional/capi
      continue-on-error: true
      if: matrix.name != 'jruby'
    - run: mv stats.yml ${{ matrix.name }}/capi.yml
      if: matrix.name != 'jruby'

    - uses: actions/checkout@v4
      with:
        ref: master
        path: rubyspec-stats
        fetch-depth: 0
    - run: rm -rf "${{ matrix.name }}"
      working-directory: rubyspec-stats
    - run: cp -R "../${{ matrix.name }}" .
      working-directory: rubyspec-stats
    - name: Commit and push
      working-directory: rubyspec-stats
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add "${{ matrix.name }}"
        git commit -m "Update ${{ matrix.name }} spec results"
        git pull --rebase
        git push

  monoruby:
    # monoruby is a from-scratch Rust implementation. Its own `setup-monoruby`
    # action distributes a rolling nightly binary (falling back to cargo build
    # + cache when no prebuilt asset matches), so it can't share the matrix
    # above but doesn't need a Rust toolchain here either.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - id: monoruby
      uses: sisshiki1969/monoruby@master

    # A host CRuby (>= 4.0, matching monoruby's reported RUBY_VERSION) provides
    # the mspec launcher and the standard library that monoruby loads at runtime.
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: "4.0"

    - name: Clone ruby/spec and mspec
      run: |
        git clone --depth 1 https://github.com/ruby/spec.git spec/ruby
        git clone --depth 1 https://github.com/ruby/mspec.git spec/mspec

    - uses: actions/checkout@v4
      with:
        ref: master
        path: rubyspec-stats
        fetch-depth: 0

    - run: mkdir results
    - name: Save RUBY_VERSION
      run: echo "${{ steps.monoruby.outputs.ruby-version }}" > results/RUBY_VERSION

    # A handful of monoruby-hostile specs (blocking I/O, Thread.stop, signals,
    # exit, sockets, ...) hang or crash the target. They're listed in
    # monoruby_skip.txt so we don't spend `SPEC_TIMEOUT` on each of them.
    # Everything except `library` runs in one mspec process per category (like
    # the other implementations, so this job matches truffleruby's ~2-minute
    # wall-time instead of ~11 minutes for per-file). `library` stays per-file
    # because many stdlib requires fail on monoruby, and per-file clamping is
    # what stops the aggregate pass rate from collapsing to zero for that
    # category. No C-API specs: monoruby has no C extension support.
    - name: Run specs
      env:
        SPEC_TIMEOUT: "30"
        SPEC_SKIP_FILE: rubyspec-stats/monoruby_skip.txt
      run: |
        for cat in language core library security command_line; do
          out=results/$cat.yml
          : > "$out"

          if [ "$cat" = library ]; then
            ruby rubyspec-stats/run_specs.rb spec/mspec/bin/mspec monoruby "spec/ruby/$cat" "$out" \
              || echo "::warning::monoruby specs for $cat did not complete"
            continue
          fi

          files=$(ruby -rset -e '
            skip = File.readlines(ENV["SPEC_SKIP_FILE"], chomp: true).reject(&:empty?).to_set
            puts Dir["spec/ruby/#{ARGV[0]}/**/*_spec.rb"].sort.reject { |f| skip.include?(f) }
          ' "$cat")

          timeout 600 spec/mspec/bin/mspec run -t monoruby --format yaml --output "$out" $files < /dev/null \
            || echo "::warning::mspec run for $cat did not complete cleanly"

          if [ -s "$out" ]; then
            # Strip the per-failure `exceptions` list (it would bloat the
            # committed yaml) and clamp examples >= failures+errors+tagged so
            # `passing` stays non-negative if any load-error imbalance survives.
            ruby -ryaml -e '
              d = YAML.load_file(ARGV[0])
              counted = d["failures"].to_i + d["errors"].to_i + d["tagged"].to_i
              d["examples"] = [d["examples"].to_i, counted].max
              d["exceptions"] = nil
              File.write(ARGV[0], d.to_yaml)
            ' "$out"
          else
            # mspec died before writing anything (an unknown hang not in the
            # skip list). Fall back to per-file so this category is still
            # measured while the new hang is investigated.
            echo "::warning::mspec run for $cat produced no yaml; falling back to run_specs.rb"
            ruby rubyspec-stats/run_specs.rb spec/mspec/bin/mspec monoruby "spec/ruby/$cat" "$out" \
              || echo "::warning::monoruby specs for $cat did not complete"
          fi
        done

    - name: Commit and push
      working-directory: rubyspec-stats
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        rm -rf monoruby
        cp -R ../results monoruby
        git add monoruby
        git commit -m "Update monoruby spec results"
        git pull --rebase
        git push

  html:
    needs: [specs, monoruby] # comment this out to only deploy
    # Wait for monoruby so its results are fresh, but don't let a monoruby
    # build/run failure block updating the site for the other implementations
    # (it falls back to the last committed monoruby/*.yml).
    if: ${{ always() && needs.specs.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: master
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.2

    - run: mkdir site
    - run: ruby analyze_per_file.rb --html ruby/*.yml truffleruby/*.yml jruby/*.yml monoruby/*.yml > site/index.html

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: site

  deploy:
    permissions:
      pages: write
      id-token: write
    needs: [html]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
