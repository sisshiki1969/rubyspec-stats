name: CI
on:
  push:
    branches: [master]
  schedule:
  - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  specs:
    # if: false # uncomment this to only deploy
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
        - { name: ruby, ruby: ruby-4.0, repo: ruby/ruby }
        - { name: jruby, ruby: jruby-head, repo: jruby/jruby }
        - { name: truffleruby, ruby: truffleruby-head, repo: oracle/truffleruby }
    runs-on: ubuntu-latest
    env:
      JRUBY_OPTS: "--dev" # Takes 14min instead of 21min otherwise on JRuby
      # No other implementation-specific options are allowed, we should test with no options, that is with defaults, because that is what users see.
    steps:
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}

    - if: matrix.name != 'ruby'
      id: ruby_revision
      run: echo "sha=$(ruby -e 'puts RUBY_REVISION')" >> $GITHUB_OUTPUT
    - if: matrix.name != 'ruby'
      uses: actions/checkout@v4
      with:
        repository: ${{ matrix.repo }}
        ref: ${{ steps.ruby_revision.outputs.sha }}

    - if: matrix.name == 'ruby'
      uses: actions/checkout@v4
      with:
        repository: ${{ matrix.repo }}

    - name: Remove file on CRuby to test the ruby in PATH
      run: rm spec/default.mspec
      if: matrix.name == 'ruby'

    - run: mkdir ${{ matrix.name }}

    - name: Save RUBY_VERSION
      run: ruby -e 'puts RUBY_VERSION' > ${{ matrix.name }}/RUBY_VERSION

    - name: Set MSPEC
      run: echo "MSPEC=spec/mspec/bin/mspec ci --timeout 60 --target $(which ruby) --marker . --format yaml --output stats.yml" >> $GITHUB_ENV

    - name: language specs
      run: $MSPEC spec/ruby/language
      continue-on-error: true
    - run: mv stats.yml ${{ matrix.name }}/language.yml

    - name: core specs
      run: $MSPEC spec/ruby/core
      continue-on-error: true
    - run: mv stats.yml ${{ matrix.name }}/core.yml

    - name: library specs
      run: $MSPEC spec/ruby/library
      continue-on-error: true
    - run: mv stats.yml ${{ matrix.name }}/library.yml

    - name: security specs
      run: $MSPEC spec/ruby/security
      continue-on-error: true
    - run: mv stats.yml ${{ matrix.name }}/security.yml

    - name: command_line specs
      run: $MSPEC spec/ruby/command_line
      continue-on-error: true
    - run: mv stats.yml ${{ matrix.name }}/command_line.yml

    - name: capi specs
      run: $MSPEC spec/ruby/optional/capi
      continue-on-error: true
      if: matrix.name != 'jruby'
    - run: mv stats.yml ${{ matrix.name }}/capi.yml
      if: matrix.name != 'jruby'

    - uses: actions/checkout@v4
      with:
        ref: master
        path: rubyspec-stats
        fetch-depth: 0
    - run: rm -rf "${{ matrix.name }}"
      working-directory: rubyspec-stats
    - run: cp -R "../${{ matrix.name }}" .
      working-directory: rubyspec-stats
    - name: Commit and push
      working-directory: rubyspec-stats
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add "${{ matrix.name }}"
        git commit -m "Update ${{ matrix.name }} spec results"
        git pull --rebase
        git push

  monoruby:
    # monoruby is a from-scratch Rust implementation. Its own `setup-monoruby`
    # action distributes a rolling nightly binary, so we don't need a Rust
    # toolchain here. One job per category (see specs matrix above) so each
    # category's wall time shows up on its own line in the Actions UI and
    # they run in parallel — the long ones (core, library) are the bottleneck
    # rather than their sum.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        category: [language, core, library, security, command_line]
        # No C-API: monoruby has no C extension support (like JRuby).
    steps:
    - id: monoruby
      uses: sisshiki1969/monoruby@master

    # A host CRuby (>= 4.0, matching monoruby's reported RUBY_VERSION) provides
    # the mspec launcher and the standard library that monoruby loads at runtime.
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: "4.0"

    - name: Clone ruby/spec and mspec
      run: |
        git clone --depth 1 https://github.com/ruby/spec.git spec/ruby
        git clone --depth 1 https://github.com/ruby/mspec.git spec/mspec

    - uses: actions/checkout@v4
      with:
        ref: master
        path: rubyspec-stats
        fetch-depth: 0

    # Only one leg writes RUBY_VERSION (it's the same value everywhere and
    # concurrent per-category pushes would otherwise fight the rebase).
    - name: Save RUBY_VERSION
      if: matrix.category == 'language'
      run: echo "${{ steps.monoruby.outputs.ruby-version }}" > rubyspec-stats/monoruby/RUBY_VERSION

    # core has to run per-file because monoruby doesn't kill background threads
    # left over from spec files at process exit — a whole-category `mspec run`
    # gets stuck in the summary phase and hits the outer timeout instead of
    # ~1min like other implementations.
    # library also runs per-file so its many `require` failures are clamped
    # per-file; an aggregate-level clamp would collapse the whole category to
    # 0% pass rate.
    # Everything else runs in one mspec process for speed, matching what the
    # other implementations do. monoruby_skip.txt filters the file list of
    # specs known to hang / crash the target.
    - name: Run ${{ matrix.category }} specs
      env:
        SPEC_TIMEOUT: "30"
        SPEC_SKIP_FILE: rubyspec-stats/monoruby_skip.txt
      run: |
        cat="${{ matrix.category }}"
        out="rubyspec-stats/monoruby/$cat.yml"
        : > "$out"

        if [ "$cat" = core ] || [ "$cat" = library ]; then
          ruby rubyspec-stats/run_specs.rb spec/mspec/bin/mspec monoruby "spec/ruby/$cat" "$out" \
            || echo "::warning::monoruby specs for $cat did not complete"
          exit 0
        fi

        files=$(ruby -rset -e '
          skip = File.readlines(ENV["SPEC_SKIP_FILE"], chomp: true).reject(&:empty?).to_set
          puts Dir["spec/ruby/#{ARGV[0]}/**/*_spec.rb"].sort.reject { |f| skip.include?(f) }
        ' "$cat")

        timeout 300 spec/mspec/bin/mspec run -t monoruby --format yaml --output "$out" $files < /dev/null \
          || echo "::warning::mspec run for $cat did not complete cleanly"

        if [ -s "$out" ]; then
          # Strip the per-failure `exceptions` list (it would bloat the
          # committed yaml) and clamp examples >= failures+errors+tagged so
          # `passing` stays non-negative if any load-error imbalance survives.
          ruby -ryaml -e '
            d = YAML.load_file(ARGV[0])
            counted = d["failures"].to_i + d["errors"].to_i + d["tagged"].to_i
            d["examples"] = [d["examples"].to_i, counted].max
            d["exceptions"] = nil
            File.write(ARGV[0], d.to_yaml)
          ' "$out"
        else
          # mspec died before writing anything (an unknown hang not yet in the
          # skip list). Fall back to per-file so this category is still
          # measured while the new hang is investigated.
          echo "::warning::mspec run for $cat produced no yaml; falling back to run_specs.rb"
          ruby rubyspec-stats/run_specs.rb spec/mspec/bin/mspec monoruby "spec/ruby/$cat" "$out" \
            || echo "::warning::monoruby specs for $cat did not complete"
        fi

    - name: Commit and push
      working-directory: rubyspec-stats
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        cat="${{ matrix.category }}"
        git add "monoruby/$cat.yml"
        if [ "$cat" = language ]; then
          git add monoruby/RUBY_VERSION
        fi
        if git diff --cached --quiet; then
          echo "no changes to commit"
          exit 0
        fi
        git commit -m "Update monoruby $cat spec results"
        # Concurrent per-category pushes race; rebase and retry a few times.
        for i in 1 2 3 4 5; do
          git pull --rebase && git push && exit 0
          sleep $((i * 2))
        done
        echo "failed to push after retries" >&2
        exit 1

  html:
    needs: [specs, monoruby] # comment this out to only deploy
    # Wait for monoruby so its results are fresh, but don't let a monoruby
    # build/run failure block updating the site for the other implementations
    # (it falls back to the last committed monoruby/*.yml).
    if: ${{ always() && needs.specs.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: master
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.2

    - run: mkdir site
    - run: ruby analyze_per_file.rb --html ruby/*.yml truffleruby/*.yml jruby/*.yml monoruby/*.yml > site/index.html

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: site

  deploy:
    permissions:
      pages: write
      id-token: write
    needs: [html]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
