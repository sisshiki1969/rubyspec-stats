name: Debug argf hang

on:
  push:
    branches: [claude/monoruby-conformance-tracking-iiBoP]

env:
  TIMEOUT: "30"

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: "4.0"

    - uses: sisshiki1969/monoruby@master

    - name: Clone ruby/spec and mspec
      run: |
        git clone --depth 1 https://github.com/ruby/spec.git spec/ruby
        git clone --depth 1 https://github.com/ruby/mspec.git spec/mspec

    - name: Run read_spec.rb one it at a time (incl. shared/read.rb)
      run: |
        set +e
        FILE=spec/ruby/core/argf/read_spec.rb
        echo "=== $FILE ==="
        # Extract `it "…"` from the main file AND from same-dir shared/*.rb
        # (it_behaves_like pulls those in).
        ruby -e '
          files = [ARGV[0], *Dir.glob(File.join(File.dirname(ARGV[0]), "shared/*.rb"))]
          descs = files.flat_map { |f| File.read(f).scan(/^\s*it (?:"([^"]+)"|'"'"'([^'"'"']+)'"'"')/).flatten.compact }
          descs.uniq.each { |d| puts d }
        ' "$FILE" > its.txt
        while IFS= read -r desc; do
          echo "---"
          echo "IT: $desc"
          timeout $TIMEOUT spec/mspec/bin/mspec run --target monoruby --format s --example "$desc" "$FILE"
          RC=$?
          if [ $RC -eq 124 ]; then echo "RESULT: HANG"; else echo "RESULT: RC=$RC"; fi
        done < its.txt
