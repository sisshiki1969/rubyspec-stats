name: Bisect monoruby core hang

# Manually dispatch with a regex to narrow the file set. Result is either
# COMPLETED (subset finishes), TIMED OUT (subset triggers the aggregate
# hang), or FAILED (mspec normal non-zero exit for failing specs).
#
# Suggested bisection order:
#   core/                first sanity: full run should time out
#   core/(a|b|c|d|e)/    first fifth
#   core/(a|b|c)/        etc.
#   core/thread/         (last visible activity before previous hang)
#
# Once the culprit sub-directory is found, narrow further to specific files.

on:
  workflow_dispatch:
    inputs:
      pattern:
        description: 'Regex to filter core file list (e.g. "core/(a|b|c)/")'
        required: true
        default: 'core/'
      timeout:
        description: 'Seconds before declaring HANG'
        required: true
        default: '120'
      format:
        description: 'mspec format (d=dots one-per-example, s=spec verbose descriptions)'
        required: true
        default: 'd'

jobs:
  bisect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: "4.0"

    - id: monoruby
      uses: sisshiki1969/monoruby@master

    - name: Clone ruby/spec and mspec
      run: |
        git clone --depth 1 https://github.com/ruby/spec.git spec/ruby
        git clone --depth 1 https://github.com/ruby/mspec.git spec/mspec

    - uses: actions/checkout@v6
      with:
        ref: master
        path: rubyspec-stats

    - name: Filter and run
      run: |
        FILES=$(find spec/ruby/core -name '*_spec.rb' \
                | grep -vFxf rubyspec-stats/monoruby_skip.txt \
                | grep -E "${{ inputs.pattern }}" \
                | sort)
        COUNT=$(printf '%s\n' "$FILES" | grep -c . || echo 0)
        echo "Pattern: ${{ inputs.pattern }}"
        echo "Matched files: $COUNT"
        [ "$COUNT" -eq 0 ] && { echo "No files matched"; exit 1; }
        echo "First: $(printf '%s\n' "$FILES" | head -1)"
        echo "Last:  $(printf '%s\n' "$FILES" | tail -1)"
        echo "---"
        set +e
        timeout ${{ inputs.timeout }} spec/mspec/bin/mspec ci \
          --target monoruby --format ${{ inputs.format }} $FILES
        RC=$?
        echo "---"
        if [ $RC -eq 124 ]; then
          echo "RESULT: HANG (killed by outer timeout at ${{ inputs.timeout }}s)"
          exit 124
        elif [ $RC -eq 0 ]; then
          echo "RESULT: COMPLETED, all pass"
        else
          echo "RESULT: COMPLETED, mspec exit $RC (normal failure count)"
        fi
